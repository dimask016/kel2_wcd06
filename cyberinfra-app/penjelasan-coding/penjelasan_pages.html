        /* CSS (tidak diubah) */

        @keyframes rotateBg { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 3rem; padding: 2rem 1rem; background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 30px; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .tabs { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); padding: 0.6rem 1.2rem; border-radius: 60px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-family: inherit; display: flex; align-items: center; gap: 0.5rem; }

        .card-header { display: flex; align-items: center; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 1.5rem; }
        .card-header i { font-size: 2rem; color: #4285F4; background: rgba(66,133,244,0.15); padding: 0.8rem; border-radius: 16px; }
        .card-header h2 { font-size: 1.6rem; font-weight: 600; }

        .table-wrapper { max-height: 520px; overflow-y: auto; border-radius: 16px; scroll-behavior: smooth; }

        .table-wrapper::-webkit-scrollbar-thumb { background: #4285F4; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead { position: sticky; top: 0; z-index: 10; }
        thead th { background: rgba(10,14,26,0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 0.8rem 0.8rem; text-align: left; font-weight: 600; color: #4285F4; border-bottom: 2px solid rgba(66,133,244,0.3); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.3px; }
        thead th:first-child { width: 50px; text-align: center; }
        thead th:nth-child(2) { width: 28%; }
        thead th:nth-child(3) { width: 38%; }
        thead th:nth-child(4) { width: 24%; }

        tbody td { padding: 0.7rem 0.8rem; vertical-align: top; line-height: 1.5; color: rgba(255,255,255,0.85); }
        tbody td:first-child { text-align: center; font-weight: 600; color: #4285F4; font-size: 0.8rem; opacity: 0.7; }
        tbody td:nth-child(2) { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #e6e6e6; word-break: break-word; }
        tbody td:nth-child(3) { font-size: 0.85rem; }
        tbody td:nth-child(4) { font-size: 0.8rem; color: #34A853; font-weight: 500; }
        .highlight { color: #34A853; font-weight: 500; }

        .row-fade { opacity: 0; transform: translateY(20px); animation: fadeUp 0.5s forwards; }

        .tab-content { display: none; animation: fadeSlide 0.4s ease; }

        .footer { text-align: center; padding: 2rem 0 1rem; opacity: 0.4; font-size: 0.8rem; letter-spacing: 0.5px; }

        @media (max-width: 768px) { body { padding: 1rem 0.5rem; } .header { padding: 1.5rem 1rem; } .tab-btn { padding: 0.4rem 0.8rem; font-size: 0.75rem; gap: 0.3rem; } .card { padding: 1rem 0.8rem 1.5rem; } .card-header h2 { font-size: 1.2rem; } .card-header i { font-size: 1.4rem; padding: 0.5rem; } .table-wrapper { max-height: 400px; } thead th { padding: 0.5rem 0.4rem; font-size: 0.6rem; } tbody td { padding: 0.5rem 0.4rem; font-size: 0.7rem; } tbody td:nth-child(2) { font-size: 0.65rem; } thead th:nth-child(2) { width: 22%; } thead th:nth-child(3) { width: 35%; } thead th:nth-child(4) { width: 25%; } }

            id: 'engineer',
            label: 'Engineer',
            icon: 'fa-users-cog',
            badge: '75 baris',
            data: [
                { no: '1-2', code: 'import React, { useState } from \'react\'; import dimasImg from \'../assets/dimas.jpeg\'; import devaImg from \'../assets/devaagriani.jpg\';', desc: 'Mengimpor React, <span class="highlight">useState</span>, dan gambar aset.', integrasi: 'Aset gambar lokal untuk engineer.' },
                { no: '4-5', code: 'const Engineer = ({ t }) => { const [filter, setFilter] = useState(\'all\');', desc: 'Komponen menerima <span class="highlight-blue">t</span>, state filter.', integrasi: 'Props <b>t</b> dari <b>translations.js</b>.' },
                { no: '7-24', code: 'const engineers = [ ... ];', desc: 'Array data 3 engineer dengan name, role, category, img, descKey, link, badge.', integrasi: 'Deskripsi dari <b>translations.js</b> (eng1_desc, dst), link ke portofolio eksternal.' },
                { no: '26', code: 'const filteredEngineers = filter === \'all\' ? engineers : engineers.filter(e => e.category === filter);', desc: 'Menyaring berdasarkan kategori yang dipilih.', integrasi: 'Fitur <b>filter</b> UI.' },
                { no: '28', code: 'if (!t) return <div>Loading translations...</div>;', desc: 'Conditional loading jika t belum tersedia.', integrasi: 'Loading state.' },
                { no: '30-64', code: 'return ( ... section ... )', desc: 'Render halaman dengan filter dropdown dan grid kartu engineer.', integrasi: 'Dropdown filter mengubah state <b>filter</b>, gambar dengan fallback, link ke portofolio.' },
            ]
        }];

        // ===== RENDER TAB DAN KONTEN =====

        const tabNav = document.getElementById('tabNav');
        const contentContainer = document.getElementById('tabContentContainer');

        // Buat tab buttons
        componentData.forEach((comp, idx) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
            btn.dataset.tab = comp.id;
            btn.innerHTML = `<i class="fas ${comp.icon}"></i> ${comp.label}`;
            tabNav.appendChild(btn);
        });

        // Buat konten
        componentData.forEach((comp, idx) => {
            const div = document.createElement('div');
            div.id = comp.id;
            div.className = `tab-content ${idx === 0 ? 'active' : ''}`;
            div.innerHTML = `
                <div class="card glow-pulse">
                    <div class="card-header">
                        <i class="fas ${comp.icon}"></i>
                        <h2>${comp.label}.jsx</h2>
                        <span class="badge"><i class="fas fa-code"></i> ${comp.badge}</span>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Kode / Struktur</th>
                                    <th>Penjelasan & Fungsi</th>
                                    <th>Integrasi / Korelasi</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-${comp.id}"></tbody>
                        </table>
                    </div>
                </div>
            `;
            contentContainer.appendChild(div);
        });

        // Isi tabel
        componentData.forEach((comp) => {
            const tbody = document.getElementById(`tbody-${comp.id}`);
            if (!tbody) return;
            let html = '';
            comp.data.forEach((row, index) => {
                const delay = index * 30;
                html += `<tr class="row-fade" style="animation-delay:${delay}ms">
                            <td>${row.no}</td>
                            <td><code>${row.code}</code></td>
                            <td>${row.desc}</td>
                            <td>${row.integrasi}</td>
                        </tr>`;
            });
            tbody.innerHTML = html;
        });

        // ===== TAB SWITCH =====

        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = {};
        componentData.forEach(comp => {
            tabContents[comp.id] = document.getElementById(comp.id);
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const target = this.dataset.tab;
                Object.values(tabContents).forEach(content => content.classList.remove('active'));
                if (tabContents[target]) {
                    tabContents[target].classList.add('active');
                    const tbody = tabContents[target].querySelector('tbody');
                    if (tbody) {
                        const rows = tbody.querySelectorAll('.row-fade');
                        rows.forEach((row, i) => {
                            row.style.animation = 'none';
                            row.offsetHeight;
                            row.style.animation = `fadeUp 0.5s forwards`;
                            row.style.animationDelay = `${i * 30}ms`;
                        });
                    }
                }
            });
        });

        // Trigger animasi awal untuk tab pertama
        setTimeout(() => {
            const firstTbody = document.querySelector('#tbody-home');
            if (firstTbody) {
                const rows = firstTbody.querySelectorAll('.row-fade');
                rows.forEach((row, i) => {
                    row.style.animation = `fadeUp 0.5s forwards`;
                    row.style.animationDelay = `${i * 30}ms`;
                });
            }
        }, 100);
    </script>
