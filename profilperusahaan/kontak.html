<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberInfra Solutions | Kontak Kami</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Space Grotesk',sans-serif; overflow-x:hidden; color:#fff; }
        #canvas-container { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
        
        /* PERBAIKAN CSS: Mengurangi kepekatan overlay hitam agar gradasi warna Three.js menembus jelas */
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%); z-index:1; pointer-events:none; }
        
        .content { position:relative; z-index:2; min-height:100vh; padding-top:6rem; }
        nav { position:fixed; top:0; width:100%; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; backdrop-filter:blur(12px); background:rgba(0,0,0,0.5); z-index:100; border-bottom:1px solid rgba(255,255,255,0.1); flex-wrap:wrap; }
        .logo { font-size:1.4rem; font-weight:700; background:linear-gradient(135deg,#fff,#4285F4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .nav-links { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
        .nav-links a { color:#fff; text-decoration:none; font-weight:500; transition:0.3s; font-size:0.9rem; }
        .nav-links a:hover { color:#4285F4; }
        .lang-toggle { display:flex; gap:0.5rem; margin-left:1rem; }
        .lang-btn { background:rgba(255,255,255,0.15); border:none; border-radius:30px; padding:0.3rem 0.8rem; font-size:0.8rem; font-weight:600; cursor:pointer; transition:0.2s; color:white; }
        .lang-btn.active { background:#4285F4; box-shadow:0 0 8px #4285F4; }
        
        /* PERBAIKAN CSS: Memberikan text-shadow global agar teks putih tetap tajam saat background terang */
        section { max-width:1100px; margin:0 auto; padding:2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
        
        .section-title { text-align:center; margin-bottom:3rem; font-size:2.8rem; font-weight:700; background:linear-gradient(135deg,#fff,#4285F4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        
        .contact-wrapper { display:grid; grid-template-columns:1fr 1.2fr; gap:3rem; align-items:start; }
        
        .contact-info { display:flex; flex-direction:column; gap:2rem; }
        .info-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:1.8rem; border-radius:16px; backdrop-filter:blur(16px); display:flex; gap:1.2rem; align-items:flex-start; transition:0.3s; box-shadow:0 10px 30px rgba(0,0,0,0.15); }
        .info-card:hover { transform:translateY(-3px); border-color:rgba(66,133,244,0.3); box-shadow:0 15px 35px rgba(66,133,244,0.1); }
        .info-card i { font-size:1.6rem; color:#4285F4; background:rgba(66,133,244,0.1); padding:0.8rem; border-radius:12px; }
        .info-details h4 { font-size:1.1rem; font-weight:600; margin-bottom:0.3rem; color:#fff; }
        .info-details p, .info-details a { font-size:0.95rem; color:rgba(255,255,255,0.8); text-decoration:none; line-height:1.5; }
        .info-details a:hover { color:#4285F4; text-decoration:underline; }
        
        /* CSS UNTUK MAPS: Penyesuaian tema gelap/cyberpunk yang responsif */
        .map-container {
            width: 100%;
            height: 250px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 0.5rem;
            transition: 0.3s;
        }
        .map-container:hover {
            border-color: rgba(66,133,244,0.4);
            box-shadow: 0 15px 35px rgba(66,133,244,0.15);
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            filter: grayscale(0.2) invert(0.9) hue-rotate(180deg);
        }
        
        .contact-form-container { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:2.5rem; border-radius:20px; backdrop-filter:blur(20px); box-shadow:0 15px 35px rgba(0,0,0,0.2); }
        .form-group { margin-bottom:1.5rem; position:relative; }
        .form-group label { display:block; font-size:0.9rem; font-weight:500; margin-bottom:0.5rem; color:rgba(255,255,255,0.9); }
        .form-control { width:100%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:0.8rem 1rem; color:#fff; font-family:inherit; font-size:0.95rem; outline:none; transition:0.3s; }
        .form-control:focus { border-color:#4285F4; box-shadow:0 0 10px rgba(66,133,244,0.25); background:rgba(0,0,0,0.6); }
        textarea.form-control { resize:none; min-height:120px; }
        
        .submit-btn { width:100%; background:linear-gradient(135deg,#4285F4,#34A853); color:#fff; border:none; border-radius:10px; padding:1rem; font-size:1rem; font-weight:600; cursor:pointer; transition:0.3s; display:flex; justify-content:center; align-items:center; gap:0.5rem; box-shadow:0 5px 15px rgba(66,133,244,0.2); }
        .submit-btn:hover { background:linear-gradient(135deg,#3374e0,#2c8e47); transform:translateY(-2px); box-shadow:0 8px 20px rgba(66,133,244,0.3); }
        
        @media (max-width:992px) {

        }
        @media (max-width:768px) {
            nav { flex-direction:column; padding:0.8rem; gap:0.5rem; }
            .nav-links { justify-content:center; gap:0.8rem; }
            .lang-toggle { margin-left:0; margin-top:0.3rem; }
            .content { padding-top:10rem; }
            .section-title { font-size:2.2rem; }
            .contact-form-container { padding:1.8rem; }
            .map-container { height: 200px; }
        }
    </style>
</head>

    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
</script>
<script type="module">
    import * as THREE from 'three';
    const scene = new THREE.Scene();
    
    const currentBgColor = new THREE.Color(0x1a2a6c);
    scene.background = currentBgColor;
    scene.fog = new THREE.FogExp2(currentBgColor, 0.002);
    
    const targetColors = [
        new THREE.Color(0x1a2a6c), // Fajar
        new THREE.Color(0x2d68c4), // Siang
        new THREE.Color(0xb03a2e), // Sore
        new THREE.Color(0xd35400), // Jingga Mentari
        new THREE.Color(0x6c3483)  // Aurora Kosmik
    ];
    let currentColorIndex = 0;
    let nextColorIndex = 1;
    let colorProgress = 0;

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 7);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    
    const ambient = new THREE.AmbientLight(0x505070);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(2, 5, 3);
    scene.add(dirLight);
    const backLight = new THREE.PointLight(0x4285F4, 0.5);
    backLight.position.set(0, 2, -4);
    scene.add(backLight);
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);
    const centerGeo = new THREE.SphereGeometry(0.9, 64, 64);
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = 'Bold 400px "Segoe UI"';
    ctx.fillStyle = '#4285F4';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('G', canvas.width/2, canvas.height/2);
    const texture = new THREE.CanvasTexture(canvas);
    const centerMat = new THREE.MeshStandardMaterial({ map: texture, color: 0xffffff, emissive: 0x2244aa });
    const centerSphere = new THREE.Mesh(centerGeo, centerMat);
    mainGroup.add(centerSphere);
    const colors = [0x4285F4, 0xEA4335, 0xFBBC05, 0x34A853];
    const orbits = [];
    const orbGeo = new THREE.SphereGeometry(0.45, 48, 48);
    for (let i = 0; i < 4; i++) {
        const orbMat = new THREE.MeshStandardMaterial({ color: colors[i], emissive: colors[i], emissiveIntensity: 0.3 });
        const orb = new THREE.Mesh(orbGeo, orbMat);
        mainGroup.add(orb);
        orbits.push(orb);
    }
    const ringGeo = new THREE.TorusGeometry(1.4, 0.05, 64, 200);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x4285F4, emissive: 0x4285F4 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    mainGroup.add(ring);
    const particleCount = 1200;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 80;
        positions[i*3+1] = (Math.random() - 0.5) * 50;
        positions[i*3+2] = (Math.random() - 0.5) * 60 - 30;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.06, transparent: true, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);
    const starCount = 800;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPos[i*3] = (Math.random() - 0.5) * 200;
        starPos[i*3+1] = (Math.random() - 0.5) * 100;
        starPos[i*3+2] = (Math.random() - 0.5) * 100 - 50;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.04, transparent: true }));
    scene.add(stars);
    let time = 0, mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        
        colorProgress += 0.002; 
        if (colorProgress >= 1) {
            colorProgress = 0;
            currentColorIndex = nextColorIndex;
            nextColorIndex = (nextColorIndex + 1) % targetColors.length;
        }
        
        currentBgColor.copy(targetColors[currentColorIndex]).lerp(targetColors[nextColorIndex], colorProgress);
        scene.background = currentBgColor;
        scene.fog.color = currentBgColor;

        mainGroup.rotation.y = time * 0.4;
        mainGroup.rotation.x = Math.sin(time * 0.2) * 0.2;
        orbits.forEach((orb, idx) => {
            const angle = time * 0.8 + idx * Math.PI/2;
            orb.position.x = Math.cos(angle) * 1.8;
            orb.position.z = Math.sin(angle) * 1.8;
            orb.position.y = Math.sin(time * 1.5 + idx) * 0.4;
        });
        ring.rotation.x = time * 0.5;
        ring.rotation.y = time * 0.7;
        particles.rotation.y = time * 0.03;
        stars.rotation.x = time * 0.01;
        camera.position.x += (mouseX * 1.2 - camera.position.x) * 0.05;
        camera.position.y += (-mouseY * 0.8 - camera.position.y) * 0.05;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<script>

                </iframe>

            infoColumn.appendChild(mapDiv);

    // Penanganan form submit korporat orisinal
    document.getElementById('corporateContactForm').addEventListener('submit', (e) => {

        const sub = document.getElementById('frm_subject').value;
        alert(`✉ Terima Kasih, ${nm}!\n\nPesan mengenai "${sub}" berhasil dikirimkan ke sistem antrean tiket penawaran CyberInfra Solutions. Tim konsultan ahli kami akan segera menghubungi Anda melalui email dalam waktu maksimal 1x24 jam kerja.`);
        document.getElementById('corporateContactForm').reset();
    });

    // Manajemen dual bahasa (ID/EN)
    const translations = {
        id: {
            nav_home: "Home", nav_about: "Tentang", nav_skills: "Layanan", nav_exp: "Pengalaman", nav_projects: "Proyek", nav_certs: "Sertifikasi", nav_contact: "Kontak", nav_engineer: "Engineer",
            contact_title: "Hubungi Kami",
            label_email: "Email Korporat",
            label_phone: "Telepon / WhatsApp",
            label_address: "Kantor Pusat",
            val_address: "CyberInfra Tower Lt. 12, Jl. Jend. Sudirman No.Kav 21, Jakarta Selatan, DKI Jakarta 12920",
            form_name: "Nama Lengkap / Instansi",
            form_email: "Email Bisnis",
            form_subject: "Subjek Layanan",
            form_msg: "Pesan / Kebutuhan Infrastruktur",
            btn_send: "Kirim Pesan Solusi"
        },
        en: {
            nav_home: "Home", nav_about: "About", nav_skills: "Services", nav_exp: "Experience", nav_projects: "Projects", nav_certs: "Certifications", nav_contact: "Contact", nav_engineer: "Engineer",
            contact_title: "Contact Us",
            label_email: "Corporate Email",
            label_phone: "Phone / WhatsApp",
            label_address: "Headquarters",
            val_address: "CyberInfra Tower 12th Floor, Jl. Jend. Sudirman No.Kav 21, South Jakarta, DKI Jakarta 12920",
            form_name: "Full Name / Enterprise Organization",
            form_email: "Business Email",
            form_subject: "Service Inquiry Subject",
            form_msg: "Message / Infrastructure Requirements",
            btn_send: "Send Solution Request"
        }
    };
    let currentLang = localStorage.getItem('lang') || 'id';
    function applyLanguage(lang) {
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if(translations[lang][key]) el.innerText = translations[lang][key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if(btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => applyLanguage(btn.getAttribute('data-lang')));
    });
    applyLanguage(currentLang);
</script>
