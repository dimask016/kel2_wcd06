<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberInfra Solutions | Layanan & Keahlian - 3D Carousel</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Space Grotesk',sans-serif; overflow-x:hidden; color:#fff; }
        #canvas-container { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }
        .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%); z-index:1; pointer-events:none; }
        .content { position:relative; z-index:2; min-height:100vh; }
        nav { position:fixed; top:0; width:100%; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; backdrop-filter:blur(12px); background:rgba(0,0,0,0.5); z-index:100; border-bottom:1px solid rgba(255,255,255,0.1); flex-wrap:wrap; }
        .logo { font-size:1.4rem; font-weight:700; background:linear-gradient(135deg,#fff,#4285F4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .nav-links { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
        .nav-links a { color:#fff; text-decoration:none; font-weight:500; transition:0.3s; font-size:0.9rem; }
        .nav-links a:hover { color:#4285F4; }
        .lang-toggle { display:flex; gap:0.5rem; margin-left:1rem; }
        .lang-btn { background:rgba(255,255,255,0.15); border:none; border-radius:30px; padding:0.3rem 0.8rem; font-size:0.8rem; font-weight:600; cursor:pointer; transition:0.2s; color:white; }
        .lang-btn.active { background:#4285F4; box-shadow:0 0 8px #4285F4; }
        .lang-btn:hover { background:#4285F4; }
        section { padding:6rem 2rem 4rem; min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .section-title { font-size:clamp(1.8rem,6vw,2.5rem); text-align:center; margin-bottom:2rem; position:relative; }
        .section-title::after { content:''; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); width:70px; height:3px; background:linear-gradient(135deg,#4285F4,#EA4335); border-radius:3px; }
        
        /* ========== 3D CIRCULAR CAROUSEL ========== */
        .carousel-container {
            width: 100%;
            max-width: 900px;
            height: 500px;
            margin: 0 auto;
            position: relative;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .carousel-3d {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }
        
        .carousel-3d:active {
            cursor: grabbing;
        }
        
        .carousel-card {
            position: absolute;
            width: 200px;
            height: 240px;
            left: 50%;
            top: 50%;
            margin-left: -100px;
            margin-top: -120px;
            background: rgba(20, 28, 48, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(66,133,244,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            padding: 1rem;
        }
        
        .carousel-card:hover {
            transform: scale(1.05);
            border-color: #4285F4;
            box-shadow: 0 0 25px rgba(66,133,244,0.5);
            background: rgba(66,133,244,0.2);
        }
        
        /* Kartu yang sedang aktif (paling depan) */
        .carousel-card.active {
            border-color: #4285F4;
            box-shadow: 0 0 30px rgba(66,133,244,0.6);
            background: rgba(66,133,244,0.25);
        }
        
        .carousel-card i {
            font-size: 3rem;
            color: #4285F4;
            margin-bottom: 1rem;
        }
        
        .carousel-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        
        .carousel-card p {
            font-size: 0.75rem;
            opacity: 0.8;
            line-height: 1.4;
        }
        
        /* Indikator halaman */
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .indicator-dot {
            width: 40px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .indicator-dot.active {
            background: #4285F4;
            width: 50px;
            box-shadow: 0 0 8px #4285F4;
        }
        
        .indicator-dot:hover {
            background: #4285F4;
        }
        
        /* Info kartu aktif */
        .active-info {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            nav { flex-direction:column; padding:0.8rem; gap:0.5rem; }
            .nav-links { justify-content:center; gap:0.8rem; }
            .lang-toggle { margin-left:0; margin-top:0.3rem; }
            section { padding:5rem 1rem 3rem; }
            
            .carousel-container {
                height: 400px;
            }
            .carousel-card {
                width: 160px;
                height: 200px;
                margin-left: -80px;
                margin-top: -100px;
            }
            .carousel-card i {
                font-size: 2rem;
            }
            .carousel-card h3 {
                font-size: 0.9rem;
            }
            .carousel-card p {
                font-size: 0.65rem;
            }
        }
    </style>
</head>

<script type="module">
    import * as THREE from 'three';
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.FogExp2(0x050510, 0.002);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 7);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(2, 5, 3);
    scene.add(dirLight);
    const backLight = new THREE.PointLight(0x4285F4, 0.5);
    backLight.position.set(0, 2, -4);
    scene.add(backLight);
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);
    const centerGeo = new THREE.SphereGeometry(0.9, 64, 64);
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = 'Bold 400px "Segoe UI"';
    ctx.fillStyle = '#4285F4';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('G', canvas.width/2, canvas.height/2);
    const texture = new THREE.CanvasTexture(canvas);
    const centerMat = new THREE.MeshStandardMaterial({ map: texture, color: 0xffffff, emissive: 0x2244aa });
    const centerSphere = new THREE.Mesh(centerGeo, centerMat);
    mainGroup.add(centerSphere);
    const colors = [0x4285F4, 0xEA4335, 0xFBBC05, 0x34A853];
    const orbits = [];
    const orbGeo = new THREE.SphereGeometry(0.45, 48, 48);
    for (let i = 0; i < 4; i++) {
        const orbMat = new THREE.MeshStandardMaterial({ color: colors[i], emissive: colors[i], emissiveIntensity: 0.3 });
        const orb = new THREE.Mesh(orbGeo, orbMat);
        mainGroup.add(orb);
        orbits.push(orb);
    }
    const ringGeo = new THREE.TorusGeometry(1.4, 0.05, 64, 200);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x4285F4, emissive: 0x4285F4 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    mainGroup.add(ring);
    const particleCount = 1200;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 80;
        positions[i*3+1] = (Math.random() - 0.5) * 50;
        positions[i*3+2] = (Math.random() - 0.5) * 60 - 30;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.06, transparent: true, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);
    const starCount = 800;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        starPos[i*3] = (Math.random() - 0.5) * 200;
        starPos[i*3+1] = (Math.random() - 0.5) * 100;
        starPos[i*3+2] = (Math.random() - 0.5) * 100 - 50;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.04, transparent: true }));
    scene.add(stars);
    let time = 0, mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = (e.clientY / window.innerHeight) * 2 - 1;
    });
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        mainGroup.rotation.y = time * 0.4;
        mainGroup.rotation.x = Math.sin(time * 0.2) * 0.2;
        orbits.forEach((orb, idx) => {
            const angle = time * 0.8 + idx * Math.PI/2;
            orb.position.x = Math.cos(angle) * 1.8;
            orb.position.z = Math.sin(angle) * 1.8;
            orb.position.y = Math.sin(time * 1.5 + idx) * 0.4;
        });
        ring.rotation.x = time * 0.5;
        ring.rotation.y = time * 0.7;
        particles.rotation.y = time * 0.03;
        stars.rotation.x = time * 0.01;
        camera.position.x += (mouseX * 1.2 - camera.position.x) * 0.05;
        camera.position.y += (-mouseY * 0.8 - camera.position.y) * 0.05;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<script>
    // Data Keahlian & Jasa Perusahaan
    const skillsData = [
        { icon: "fas fa-server", title: "Infrastruktur TI", desc: "Desain Data Center, Virtualisasi & Cloud Architecture enterprise." },
        { icon: "fas fa-shield-alt", title: "Sistem Proteksi EDR/SIEM", desc: "Pemantauan ancaman real-time, mitigasi serangan, & manajemen insiden siber." },
        { icon: "fas fa-network-wired", title: "Jaringan Aman & SD-WAN", desc: "Instalasi firewall Next-Gen, arsitektur Zero-Trust, & konektivitas multi-cabang." },
        { icon: "fas fa-user-shield", title: "Manajemen Akses (PAM/IAM)", desc: "Kontrol hak akses ketat, proteksi kredensial, & tata kelola identitas user." },
        { icon: "fas fa-search-minus", title: "Audit & Kepatuhan Keamanan", desc: "Penetration Testing, penilaian kerentanan, & pemenuhan standar regulasi." },
        { icon: "fas fa-history", title: "Backup & Disaster Recovery", desc: "Perlindungan data dari ransomware, failover otomatis, & kontinuitas bisnis." }
    ];
    
    // Konfigurasi carousel 3D
    const cardCount = skillsData.length;
    let currentAngle = 0;
    let rotationY = 0;
    let isDragging = false;
    let startX = 0;
    let lastX = 0;
    let currentRotationY = 0;
    let targetRotationY = 0;
    let autoRotate = true;
    let autoRotateTimer;
    
    const radius = 280; // Jari-jari lingkaran 3D
    const container = document.getElementById('carousel3d');
    const indicatorsContainer = document.getElementById('indicators');
    
    // Generate kartu
    function generateCards() {
        container.innerHTML = '';
        skillsData.forEach((skill, index) => {
            const angle = (index / cardCount) * Math.PI * 2;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;
            
            const card = document.createElement('div');
            card.className = 'carousel-card';
            card.setAttribute('data-index', index);
            card.setAttribute('data-title', skill.title);
            card.style.transform = `translateX(${x}px) translateZ(${z}px)`;
            card.innerHTML = `
                <i class="${skill.icon}"></i>
                <h3 data-key="skill${index+1}_title">${skill.title}</h3>
                <p data-key="skill${index+1}_desc">${skill.desc}</p>
            `;
            
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const title = card.getAttribute('data-title') || skill.title;
                alert(`💼 Solusi: ${title}\n\n${skill.desc}\n\nDidukung oleh ahli bersertifikasi internasional untuk performa bisnis yang aman dan stabil.`);
            });
            
            container.appendChild(card);
        });
    }
    
    // Update rotasi carousel
    function updateRotation() {
        const cards = document.querySelectorAll('.carousel-card');
        const angleStep = (Math.PI * 2) / cardCount;
        
        cards.forEach((card, index) => {
            const angle = (index * angleStep) + rotationY;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;
            card.style.transform = `translateX(${x}px) translateZ(${z}px)`;
            
            // Tentukan kartu yang paling depan (z terbesar)
            const zValue = Math.cos(angle) * radius;
            if (zValue > radius - 50) {
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }
        });
        
        // Update indikator
        updateIndicators();
        
        // Update info aktif
        updateActiveInfo();
    }
    
    // Update indikator dot
    function updateIndicators() {
        const cards = document.querySelectorAll('.carousel-card');
        let maxZ = -999;
        let activeIndex = 0;
        
        cards.forEach((card, index) => {
            const transform = card.style.transform;
            const match = transform.match(/translateZ\(([-\d.]+)px/);
            if (match) {
                const z = parseFloat(match[1]);
                if (z > maxZ) {
                    maxZ = z;
                    activeIndex = index;
                }
            }
        });
        
        const dots = document.querySelectorAll('.indicator-dot');
        dots.forEach((dot, idx) => {
            if (idx === activeIndex) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });
    }
    
    // Update info kartu aktif
    function updateActiveInfo() {
        const cards = document.querySelectorAll('.carousel-card');
        let maxZ = -999;
        let activeCard = null;
        
        cards.forEach((card) => {
            const transform = card.style.transform;
            const match = transform.match(/translateZ\(([-\d.]+)px/);
            if (match) {
                const z = parseFloat(match[1]);
                if (z > maxZ) {
                    maxZ = z;
                    activeCard = card;
                }
            }
        });
        
        if (activeCard) {
            const title = activeCard.querySelector('h3')?.innerText || '';
            const infoDiv = document.getElementById('activeInfo');
            if (infoDiv) {
                infoDiv.innerHTML = `<i class="fas fa-star"></i> Solusi Aktif: ${title} | Geser kiri/kanan untuk memutar | Klik kartu untuk detail`;
            }
        }
    }
    
    // Animasi rotasi halus
    let animFrame;
    function animateRotation() {
        const diff = targetRotationY - rotationY;
        rotationY += diff * 0.1;
        updateRotation();
        
        animFrame = requestAnimationFrame(animateRotation);
    }
    
    // Event mouse untuk drag
    function initDragEvents() {
        const carousel = document.getElementById('carousel3d');
        
        carousel.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            lastX = e.clientX;
            carousel.style.cursor = 'grabbing';
            
            // Hentikan auto-rotate saat drag
            if (autoRotateTimer) clearInterval(autoRotateTimer);
            autoRotate = false;
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - lastX;
            if (deltaX !== 0) {
                const rotateStep = deltaX * 0.008;
                targetRotationY += rotateStep;
                lastX = e.clientX;
            }
        });
        
        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                carousel.style.cursor = 'grab';
                
                // Mulai auto-rotate setelah 3 detik idle
                if (autoRotateTimer) clearInterval(autoRotateTimer);
                autoRotateTimer = setTimeout(() => {
                    autoRotate = true;
                    startAutoRotate();
                }, 3000);
            }
        });
        
        carousel.addEventListener('dragstart', (e) => e.preventDefault());
    }
    
    // Auto rotate
    function startAutoRotate() {
        if (!autoRotate) return;
        if (autoRotateTimer) clearInterval(autoRotateTimer);
        autoRotateTimer = setInterval(() => {
            if (autoRotate && !isDragging) {
                targetRotationY += 0.02;
            }
        }, 50);
    }
    
    // Generate indikator dots
    function generateIndicators() {
        indicatorsContainer.innerHTML = '';
        for (let i = 0; i < cardCount; i++) {
            const dot = document.createElement('div');
            dot.className = 'indicator-dot';
            dot.addEventListener('click', () => {
                const cards = document.querySelectorAll('.carousel-card');
                let currentMaxZ = -999;
                let currentIndex = 0;
                
                cards.forEach((card, idx) => {
                    const transform = card.style.transform;
                    const match = transform.match(/translateZ\(([-\d.]+)px/);
                    if (match) {
                        const z = parseFloat(match[1]);
                        if (z > currentMaxZ) {
                            currentMaxZ = z;
                            currentIndex = idx;
                        }
                    }
                });
                
                const delta = (i - currentIndex) * (Math.PI * 2 / cardCount);
                targetRotationY += delta;
            });
            indicatorsContainer.appendChild(dot);
        }
    }
    
    // Inisialisasi
    generateCards();
    generateIndicators();
    initDragEvents();
    animateRotation();
    startAutoRotate();
    
    // Translasi bahasa perusahaan (ID/EN)
    const translations = {
        id: {
            nav_home: "Home", nav_about: "Tentang", nav_skills: "Layanan", nav_exp: "Pengalaman", 
            nav_projects: "Proyek", nav_certs: "Sertifikasi", nav_contact: "Kontak",
            skills_title: "Solusi & Layanan Kami",
            skill1_title: "Infrastruktur TI", skill1_desc: "Desain Data Center, Virtualisasi & Cloud Architecture enterprise.",
            skill2_title: "Sistem Proteksi EDR/SIEM", skill2_desc: "Pemantauan ancaman real-time, mitigasi serangan, & manajemen insiden siber.",
            skill3_title: "Jaringan Aman & SD-WAN", skill3_desc: "Instalasi firewall Next-Gen, arsitektur Zero-Trust, & konektivitas multi-cabang.",
            skill4_title: "Manajemen Akses (PAM/IAM)", skill4_desc: "Kontrol hak akses ketat, proteksi kredensial, & tata kelola identitas user.",
            skill5_title: "Audit & Kepatuhan Keamanan", skill5_desc: "Penetration Testing, penilaian kerentanan, & pemenuhan standar regulasi.",
            skill6_title: "Backup & Disaster Recovery", skill6_desc: "Perlindungan data dari ransomware, failover otomatis, & kontinuitas bisnis."
        },
        en: {
            nav_home: "Home", nav_about: "About", nav_skills: "Services", nav_exp: "Experience", 
            nav_projects: "Projects", nav_certs: "Certifications", nav_contact: "Contact",
            skills_title: "Our Services & Solutions",
            skill1_title: "IT Infrastructure", skill1_desc: "Enterprise Data Center design, Virtualization, & Cloud Architecture Solutions.",
            skill2_title: "EDR & SIEM Protection", skill2_desc: "Real-time threat monitoring, cyber incident response, & advanced mitigation.",
            skill3_title: "Secure Network & SD-WAN", skill3_desc: "Next-Gen Firewall deployments, Zero-Trust architecture, & branch connectivity.",
            skill4_title: "Access Management (PAM/IAM)", skill4_desc: "Privileged access controls, credential security, & user identity governance.",
            skill5_title: "Security Audits & Compliance", skill5_desc: "Penetration testing, vulnerability assessments, & compliance reporting.",
            skill6_title: "Backup & Disaster Recovery", skill6_desc: "Ransomware data protection, automated failover, & business continuity."
        }
    };
    
    let currentLang = localStorage.getItem('lang') || 'id';
    
    function applyLanguage(lang) {
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if(translations[lang][key]) el.innerText = translations[lang][key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if(btn.getAttribute('data-lang') === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        localStorage.setItem('lang', lang);
        
        // Update ulang teks secara dinamis pada kartu saat bahasa ditukar
        skillsData.forEach((skill, idx) => {
            const cards = document.querySelectorAll('.carousel-card');
            if (cards[idx]) {
                const titleKey = `skill${idx+1}_title`;
                const descKey = `skill${idx+1}_desc`;
                const titleEl = cards[idx].querySelector('h3');
                const descEl = cards[idx].querySelector('p');
                if (titleEl && translations[lang][titleKey]) titleEl.innerText = translations[lang][titleKey];
                if (descEl && translations[lang][descKey]) descEl.innerText = translations[lang][descKey];
            }
        });
        
        updateActiveInfo();
    }
    
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => applyLanguage(btn.getAttribute('data-lang')));
    });
    applyLanguage(currentLang);
</script>
</body>
</html>
